# slam_toolbox 在线异步建图参数（阶段 3）
#
# 用法：
#   ros2 launch nav_bot_navigation slam.launch.py
#
# 与官方 slam_toolbox/config/mapper_params_online_async.yaml 的差异都写了理由，
# 改参数前先读对应注释——不理解就保持默认，一次只改一个。
#
# 本机型特殊点：URDF 根 link 是零质量的 base_footprint（为消除 KDL 的
#   "root link has an inertia" 警告），base_link 由 robot_state_publisher 以固定
#   TF 挂在 base_footprint 下，且两者原点重合（base_link 在地面上，z=0）。
#   所以 base_frame 写 base_link、base_footprint 都成立（TF 链：odom -> base_footprint
#   -> base_link）；这里保留 base_link，与既有参数/实测保持一致。

slam_toolbox:
  ros__parameters:

    # ==================== 求解器（求位姿图优化解） ====================
    # Ceres 比内置的 SpaSolver 更稳，官方默认即 Ceres，不用改
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ==================== 坐标系 / 话题（本项目的核心改动） ====================
    odom_frame: odom          # 来自 gz DiffDrive 插件
    map_frame: map            # slam_toolbox 自己发布 map -> odom
    base_frame: base_link     # ★ 与 base_footprint 原点重合，两者都可写；沿用实测通过的 base_link
    scan_topic: /scan         # 与 sim.launch.py 桥接的 gz 话题一致
    use_map_saver: true
    mode: mapping             # mapping=建图；阶段 4 定位改 localization
                              # （slam_toolbox 的 localization 是"在地图内定位"，
                              #   阶段 4 若用 AMCL，则本项目根本不起 slam_toolbox）

    # 续建地图（可选）：从一个已有 pose_graph 继续，与 map_start_pose 互斥
    # map_file_name: /path/to/my_map_serial
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    # ==================== 运行节奏 ====================
    debug_logging: false
    throttle_scans: 1                     # 每 N 帧用 1 帧；CPU 吃紧可改 2~3
    transform_publish_period: 0.02        # map->odom 发布周期 = 50 Hz
                                          # ★ 设 0 则永不发布 TF，RViz 里车会"跳"，
                                          #   全局代价地图也拿不到位姿
    map_update_interval: 1.0              # 地图栅格重绘周期（官方 5.0 太钝，
                                          #   建图时 1 s 一刷新才能及时发现问题）
    resolution: 0.05                      # 与地图/costmap 一致，0.05 m/格
    restamp_tf: false                     # true 会用墙钟重打时间戳，仿真里务必 false
    min_laser_range: 0.15                 # 与雷达 <min>0.15</min> 对齐，滤掉自身遮挡
    max_laser_range: 12.0                 # 与雷达 12 m 量程对齐；雷达没打到的远方
                                          #   不应被当作"自由空间"
    minimum_time_interval: 0.5            # 两帧处理的最小时间间隔，防 CPU 打满
    transform_timeout: 0.2                # 等 TF 的超时
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000           # 保存大地图时序列化需要更大栈，别调小
    enable_interactive_mode: true         # RViz 里可拖动地图调 loop closure（手工修图有用）

    # ==================== 关键帧采样（省 CPU 的核心） ====================
    # 不是每帧扫描都入库，只有"走够远 / 转够多"才取一个关键帧。
    # 走得太密 -> 位姿图巨大、优化慢；太稀 -> 转弯处匹配不上、地图断裂。
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3          # 走 30 cm 才处理新帧（官方 0.5 略稀，
                                          #   室内慢速建图 0.3 更细）
    minimum_travel_heading: 0.3           # 转 0.3 rad ≈ 17° 才处理新帧
    check_min_dist_and_heading_precisely: false  # 加严判据，一般不需要
    scan_buffer_size: 10                  # 缓存关键帧数，用于匹配与回环
    scan_buffer_maximum_scan_distance: 10.0

    # ==================== 扫描匹配 ====================
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5        # 相邻关键帧最大间距（m）

    # ==================== 回环检测（决定地图"双墙/不闭合"的开关） ====================
    do_loop_closing: true
    loop_search_maximum_distance: 3.0      # 离旧关键帧 3 m 内才尝试回环——
                                           #   small_house 房间小，这个值合适
    loop_match_minimum_chain_size: 10      # 连续 10 个关键帧都匹配才算回环，防误检
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ==================== 相关性搜索（扫描匹配的粗搜参数） ====================
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ==================== 回环搜索空间 ====================
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ==================== 匹配惩罚项 ====================
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
