<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" width="680" height="514" role="img" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<title>Nav2 导航栈结构：输入 / 执行 / 输出</title>
<desc>Nav2 导航栈的三层结构：输入层为 Waypoint Follower（单/多目标点）与 Autonomy System（自动化系统），并依赖 BT、TF、map、Sensor Data；执行层由 BT Navigator Server、Planner、Controller、Behavior、Smoother、Route 五个服务器与 Lifecycle Manager 组成；输出层经 Velocity Smoother、Collision Monitor 输出到 Robot Base。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="514" fill="#FFFFFF"/>

<text x="40" y="46" font-size="15" font-weight="500" fill="#1A1A1A">Nav2 导航栈：输入 → 执行 → 输出</text>

<rect x="40" y="60" width="600" height="104" rx="12" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="56" y="80" font-size="12" fill="#185FA5">输入</text>

<rect x="110" y="72" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="225" y="88" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Waypoint Follower</text>
<text x="225" y="103" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">单目标点 / 多目标点</text>

<rect x="370" y="72" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="485" y="88" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Autonomy System</text>
<text x="485" y="103" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">自动化系统</text>

<rect x="110" y="124" width="52" height="22" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="136" y="135" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">BT</text>
<rect x="170" y="124" width="52" height="22" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="196" y="135" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">TF</text>
<rect x="230" y="124" width="60" height="22" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="260" y="135" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">map</text>
<rect x="298" y="124" width="104" height="22" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="350" y="135" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Sensor Data</text>
<text x="414" y="135" font-size="11" dominant-baseline="central" fill="#5F5E5A">← 四个公共依赖</text>

<path d="M340 164L340 184" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="186" width="600" height="200" rx="20" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="56" y="206" font-size="12" fill="#185FA5">执行</text>

<rect x="140" y="196" width="250" height="44" rx="10" fill="#85B7EB" stroke="#378ADD" stroke-width="0.5"/>
<text x="265" y="210" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#042C53">BT Navigator Server</text>
<text x="265" y="227" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0C447C">行为树服务器（核心）</text>

<rect x="430" y="196" width="190" height="44" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="525" y="210" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Lifecycle Manager</text>
<text x="525" y="227" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">生命周期管理</text>
<path d="M428 218L392 218" fill="none" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<path d="M265 240L265 262" fill="none" stroke="#378ADD" stroke-width="1.5"/>
<path d="M102 262L538 262" fill="none" stroke="#378ADD" stroke-width="1.5"/>
<path d="M102 262L102 274" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M211 262L211 274" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 262L320 274" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M429 262L429 274" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M538 262L538 274" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="52" y="276" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="102" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Controller</text>
<text x="102" y="330" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">本地路径规划</text>

<rect x="161" y="276" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="211" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Planner</text>
<text x="211" y="330" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">全局路径规划</text>

<rect x="270" y="276" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="320" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Behavior</text>
<text x="320" y="330" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">脱困恢复行为</text>

<rect x="379" y="276" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="429" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Smoother</text>
<text x="429" y="324" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">路径平滑</text>

<rect x="488" y="276" width="100" height="80" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="538" y="306" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Route</text>
<text x="538" y="330" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">多地图拼接</text>

<text x="56" y="374" font-size="11" fill="#5F5E5A">BT Navigator 通过 action 调用各服务器；未 activate 的节点等于不存在</text>

<path d="M102 386L102 402" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="396" font-size="11" dominant-baseline="central" fill="#5F5E5A">cmd_vel</text>

<rect x="40" y="404" width="600" height="90" rx="12" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="56" y="420" font-size="12" fill="#185FA5">输出</text>

<rect x="80" y="430" width="155" height="42" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="157" y="446" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Velocity Smoother</text>
<text x="157" y="461" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">速度平滑</text>
<path d="M237 451L263 451" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="267" y="430" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="347" y="446" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Collision Monitor</text>
<text x="347" y="461" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">障碍物监测</text>
<path d="M429 451L455 451" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="459" y="430" width="155" height="42" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="536" y="446" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Robot Base</text>
<text x="536" y="461" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#185FA5">控制机器人运动</text>
</svg>
